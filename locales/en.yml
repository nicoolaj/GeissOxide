cli.gain: "Input gain multiplier"
cli.preset_duration: "Seconds before switching MilkDrop preset, or figure/palette in the other engines"
cli.allow_shader_presets: "Also load MilkDrop 2 presets that need pixel shaders (rendered without them)"
cli.input: "Audio source: 'device' (default) or 'test' (built-in synthetic signal)"
cli.frames: "Render this many frames then exit (with --screenshot)"
cli.screenshot: "Save the last frame as PNG to this path"
