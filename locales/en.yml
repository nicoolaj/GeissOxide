_version: 1
app.about: "GeissOxide, MilkDrop, Chladni, Tonnetz, Ferrofluid and Pool audio visualizers. Captures the sound card (internal loopback or external input)."
app.help_keys: |
  Keys: Esc quit | F fullscreen | Tab switch engine | Space/Right next preset, map or figure
        Left previous preset | L lock preset | D next input device | +/- gain | H this help
